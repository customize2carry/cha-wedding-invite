<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- COVER WITH CURTAIN -->
  <section id="cover">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="cover-content">
      <p class="small">Please open to</p>
      <button id="openBtn">Open Invitation</button>
    </div>
  </section>

  <main id="invite" class="hidden">

    <!-- HERO -->
    <section class="hero reveal">
      <p class="small" id="tagline"></p>
      <h1><span id="groom"></span><br /><em>weds</em><br /><span id="bride"></span></h1>
      <div class="countdown" id="countdown">
        <div><b id="cd-d">0</b><span>Days</span></div>
        <div><b id="cd-h">0</b><span>Hours</span></div>
        <div><b id="cd-m">0</b><span>Mins</span></div>
        <div><b id="cd-s">0</b><span>Secs</span></div>
      </div>
      <p class="scroll-hint">Scroll down ↓</p>
    </section>

    <!-- FLIP NOTE CARD -->
    <section class="reveal">
      <h2 id="noteTitle"></h2>
      <div class="flip" id="flipCard">
        <div class="flip-inner">
          <div class="flip-front"><p>Tap to open</p></div>
          <div class="flip-back"><p id="noteText"></p></div>
        </div>
      </div>
    </section>

    <!-- FAMILIES -->
    <section class="reveal">
      <h2>Our Families</h2>
      <div class="families" id="families"></div>
    </section>

    <!-- EVENTS -->
    <section class="reveal">
      <h2>Celebrations</h2>
      <div id="events"></div>
    </section>

    <!-- THANK YOU -->
    <section class="reveal thanks">
      <h2 id="tyTitle"></h2>
      <p id="tyText"></p>
      <p class="sign" id="tySign"></p>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
